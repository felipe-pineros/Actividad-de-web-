<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>MyShoeMe - Tu Estilo en Cada Paso</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
            rel="stylesheet"
        />
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <nav
            class="navbar navbar-expand-lg navbar-dark bg-primary-custom shadow"
        >
            <div class="container">
                <a class="navbar-brand" href="/">
                    <span class="logo-emoji">👟</span>MyShoeMe
                </a>
                <div class="d-flex">
                    <a href="/cart.html" class="btn btn-outline-custom">
                        🛒 Carrito
                        <span id="cart-count" class="badge badge-custom ms-1"
                            >0</span
                        >
                    </a>
                </div>
            </div>
        </nav>

        <header class="py-5 text-center">
            <div class="container">
                <h1 class="display-4 fw-bold mb-3">Tu Estilo en Cada Paso</h1>
                <p class="lead">
                    Descubre la colección más exclusiva de calzado deportivo y
                    casual. Calidad premium, diseños únicos.
                </p>
                <div class="mt-4">
                    <button class="btn btn-primary-custom btn-lg">
                        Explorar Colección
                    </button>
                </div>
            </div>
        </header>

        <main class="container py-5">
            <h2
                class="text-center mb-4 fw-bold"
                style="color: var(--primary-color)"
            >
                Productos Destacados
            </h2>
            <div id="product-list" class="row g-4"></div>
        </main>

        <footer class="py-5 text-light">
            <div class="container">
                <div class="row">
                    <div
                        class="col-md-6 text-center text-md-start mb-3 mb-md-0"
                    >
                        <h5 class="mb-2">
                            <span class="logo-emoji">👟</span>
                            <span
                                style="
                                    font-family: 'Playfair Display', serif;
                                    font-weight: 700;
                                "
                                >MyShoeMe</span
                            >
                        </h5>
                        <p class="mb-0 text-muted">
                            Calidad y estilo desde 2024
                        </p>
                    </div>
                    <div class="col-md-6 text-center text-md-end">
                        <p class="mb-0">
                            &copy; <span id="year"></span> MyShoeMe. Todos los
                            derechos reservados.
                        </p>
                    </div>
                </div>
            </div>
        </footer>

        <script src="js/app.js" type="module"></script>
        <script>
            document.getElementById("year").textContent =
                new Date().getFullYear();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
